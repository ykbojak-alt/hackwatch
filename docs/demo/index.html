<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackathon Watch — NEXUS AiOS</title>
<style>
:root {
  --bg:#0b0d11; --panel:#10131a; --raised:#161a22; --hover:#1c212b; --line:#232833; --line2:#2d3340;
  --fg:#e9e4d6; --on:#0b0d11;
  --cyan:#00c8ff; --gold:#d4af37; --red:#d9605a; --amber:#e8c96a; --green:#8fb573;
  --red-dim:rgba(217,96,90,.14); --cyan-dim:rgba(0,200,255,.12); --gold-dim:rgba(212,175,55,.10);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
* { box-sizing:border-box; }
html { color-scheme:dark; }
body {
  margin:0; padding:24px 30px 40px;
  color:var(--fg); font-family:var(--sans); font-size:19.5px; line-height:1.55;
  background:
    radial-gradient(1100px 500px at 50% -150px, rgba(0,200,255,.07), transparent 60%),
    var(--bg);
}
h1 { font-size:31px; margin:0 0 0; letter-spacing:.02em; font-weight:700; }
/* голографический заголовок — переливающаяся фольга в палитре nexus-lux */
h1 .holo {
  background: linear-gradient(100deg,
    #8ab4ff 0%, #00c8ff 22%, #7be8d8 40%, #e8c96a 58%, #c59bff 76%, #8ab4ff 100%);
  background-size: 280% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: holo-flow 9s linear infinite;
  filter: drop-shadow(0 0 14px rgba(0,200,255,.22)) drop-shadow(0 1px 6px rgba(197,155,255,.12));
}
@keyframes holo-flow { to { background-position: 280% 0; } }
.brand { color:var(--muted); font-size:15.5px; letter-spacing:.05em; margin:1px 0 14px; }
.brand .cyan { color:var(--cyan); }
.sub { color:var(--muted); font-size:17px; margin:0 0 16px; }
.langsw { position:absolute; top:24px; right:30px; display:flex; gap:4px; z-index:5; }
.pager { position:absolute; top:24px; right:170px; display:flex; gap:4px; z-index:5; }
.pager button {
  background:var(--raised); color:var(--muted); border:1px solid var(--line); border-radius:7px;
  padding:5px 14px; font:inherit; font-size:15.5px; cursor:pointer; transition:color .15s, border-color .15s, background .15s;
}
.pager button:hover { color:var(--fg); }
.pager button.on { color:var(--on); background:var(--cyan); border-color:var(--cyan); }
.page { display:none; }
.page.on { display:block; }
/* страница «По трекам» */
.p-summary {
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
  font-size:15px; color:var(--muted); margin-bottom:14px;
}
.p-summary b { color:var(--fg); font-weight:600; }
.p-summary .cyan { color:var(--cyan); }
.tracks-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(560px, 1fr)); gap:16px; }
.p-track { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
.p-track-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px; }
.p-track-head .tname { font-size:17.5px; font-weight:700; color:var(--cyan); }
.p-track-head .cnt { font-size:13.5px; color:var(--muted); }
.p-table { width:100%; table-layout:fixed; border-collapse:separate; border-spacing:0; }
/* заголовки трек-таблиц: короткие (# / WP / STR / PROJECT / DEMO), БЕЗ резки —
   только колонка project (.tproj) имеет ellipsis; остальные no-wrap и видимы. */
.p-table th {
  position:static; background:transparent; color:var(--muted); font-size:12px;
  letter-spacing:.06em; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line);
  white-space:nowrap; overflow:visible; text-overflow:clip;
}
.p-table th.tproj { overflow:hidden; text-overflow:ellipsis; }
.p-table td { padding:7px 8px; border-bottom:1px solid var(--line); font-size:15.5px; white-space:nowrap; overflow:visible; vertical-align:middle; }
.p-table tbody tr:last-child td { border-bottom:0; }
.p-table .tplace { width:32px; }
.p-table td.tplace { color:var(--muted); font-family:var(--mono); font-size:15px; text-align:right; }
.p-table td.tproj { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:0; }
.p-table .tproj { overflow:hidden; }
.p-table .twp { width:118px; }
.p-table .tst { width:78px; }
.p-table .tdemo { width:150px; }
.p-table .cellbar .v { font-size:15.5px; }
.p-table .strength { font-size:15px; padding:2px 7px; }
.p-table .strength .scale { font-size:13px; }
/* demo+crowd чипы в трек-таблице переносятся внутрь ячейки, не лезут на соседи */
.p-table td.tdemo { white-space:normal; }
.p-table td.tdemo .dcompact, .p-table td.tdemo .crowd-chip { margin:1px 2px 1px 0; }
/* подиум-подсветка 1/2/3 — плоский тинт (НЕ градиент) + левая кромка 3px */
tr.podium-gold td { background:rgba(212,175,55,.09); }
tr.podium-gold { box-shadow:inset 3px 0 0 var(--gold); }
tr.podium-gold .tplace { color:var(--gold); font-weight:700; }
tr.podium-silver td { background:rgba(200,206,214,.06); }
tr.podium-silver { box-shadow:inset 3px 0 0 #c8ced6; }
tr.podium-silver .tplace { color:#c8ced6; font-weight:700; }
tr.podium-bronze td { background:rgba(200,140,90,.08); }
tr.podium-bronze { box-shadow:inset 3px 0 0 #c88c5a; }
tr.podium-bronze .tplace { color:#c88c5a; font-weight:700; }
/* dup-бейдж: приглушённый чип, строка чуть затушёвана */
.dup-chip {
  display:inline-block; font-size:11px; color:var(--muted); border:1px dashed var(--line2);
  border-radius:4px; padding:0 5px; margin-left:6px; vertical-align:1px; opacity:.7;
}
tr.dup td { opacity:.55; }
/* deadline-бейдж (шапка) */
.deadline {
  display:inline-flex; align-items:center; gap:6px; background:var(--raised); border:1px solid var(--line);
  border-radius:7px; padding:4px 10px; font-size:13px; color:var(--muted); margin-left:12px;
}
.deadline b { color:var(--fg); font-family:var(--mono); font-weight:600; }
/* компактный demo-чип для трековых таблиц */
.dcompact { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-family:var(--mono); color:var(--muted); white-space:nowrap; }
.dcompact .sym { font-weight:700; }
.dcompact.ok .sym { color:var(--cyan); }
.dcompact.x .sym { color:#e8c96a; }
.dcompact.warn .sym { color:var(--line2); }
/* WAVE-2C: crowd-дельта + attest-чипы */
.crowd-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-family:var(--mono);
  color:var(--muted); background:var(--raised); border:1px solid var(--line); border-radius:5px;
  padding:1px 6px; white-space:nowrap; }
.crowd-chip .up { color:var(--cyan); }
.crowd-chip .down { color:#e8c96a; }
.crowd-chip.compact { padding:1px 5px; }
.attest-chip { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-family:var(--mono);
  border-radius:5px; padding:1px 6px; white-space:nowrap; }
.attest-chip .sym { font-weight:700; }
.attest-chip.ok { color:var(--cyan); background:rgba(0,200,255,.07); border:1px solid rgba(0,200,255,.25); }
.attest-chip.ok .sym { color:var(--cyan); }
.attest-chip.none { color:var(--muted); background:var(--raised); border:1px solid var(--line); }
/* WAVE-2C: вкладка «Лента» */
.feed { max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
.feed-item { display:flex; gap:12px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); }
.feed-item:last-child { border-bottom:0; }
.feed-item .ficon { font-family:var(--mono); font-size:13px; width:14px; text-align:center; }
.feed-item .ficon.new { color:var(--cyan); }
.feed-item .ficon.removed { color:#d9605a; }
.feed-item .ficon.demo_changed { color:#e8c96a; }
.feed-item .fname { font-weight:600; font-size:15px; }
.feed-item .fdet { font-size:12px; color:var(--muted); }
.feed-item .fts { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted); }
.feed-empty { padding:24px; text-align:center; color:var(--muted); font-size:14px; }
.toverall {
  font-size:11px; color:var(--muted); margin-left:4px; font-family:var(--mono);
  vertical-align:2px; opacity:.7;
}
.langsw button {
  background:var(--raised); color:var(--muted); border:1px solid var(--line); border-radius:7px;
  padding:5px 13px; font:inherit; font-size:15.5px; cursor:pointer; transition:color .15s, border-color .15s, box-shadow .15s;
}
.langsw button:hover { color:var(--fg); border-color:var(--line2); }
.langsw button.on { color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 12px rgba(0,200,255,.18); }
.cards { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; }
.card .l { color:var(--muted); font-size:14.5px; letter-spacing:.06em; margin-top:0; }
.card .n { font-size:31px; font-weight:700; color:var(--fg); font-family:var(--mono); line-height:1.2; }
.card .n.cyan { color:var(--cyan); }
.toolbar { margin:0 0 14px; color:var(--muted); font-size:18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.seg { display:inline-flex; background:var(--raised); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button {
  background:transparent; color:var(--muted); border:0; border-right:1px solid var(--line);
  font:inherit; font-size:17px; padding:6px 14px; cursor:pointer; white-space:nowrap;
  transition:color .15s, background .15s;
}
.seg button:last-child { border-right:0; }
.seg button:hover { color:var(--fg); }
.seg button.on { color:var(--on); background:var(--cyan); }
.seg button .cnt { opacity:.6; font-size:14.5px; margin-left:4px; }
.toolbar .search {
  margin-left:auto; display:flex; align-items:center; gap:6px; min-width:200px;
  background:var(--raised); border:1px solid var(--line); border-radius:7px; padding:4px 10px;
}
.toolbar .search:focus-within { border-color:var(--cyan); box-shadow:0 0 0 2px rgba(0,200,255,.12); }
.toolbar .search input { background:transparent; border:0; outline:0; color:var(--fg); font:inherit; font-size:16px; width:100%; }
.toolbar .search input::placeholder { color:var(--dim); }
.toolbar .search .ico { color:var(--dim); font-size:15.5px; }
#hint { margin-left:4px; }
/* кликабельные чипы треков */
.track-chip {
  display:inline-block; padding:2px 9px; margin:1px 3px; border-radius:12px;
  font-size:15.5px; color:var(--muted); border:1px solid var(--line); cursor:pointer;
  transition:color .12s, border-color .12s, background .12s; user-select:none;
}
.track-chip:hover { color:var(--fg); border-color:var(--line2); }
.track-chip.on { color:var(--cyan); border-color:rgba(0,200,255,.5); background:var(--cyan-dim); }
/* мелкий чип модели-оценщика */
.ev-chip {
  display:inline-block; font-size:13.5px; color:var(--muted); border:1px solid var(--line);
  border-radius:4px; padding:1px 6px; margin-left:4px; vertical-align:1px; opacity:.9;
}
table { width:100%; border-collapse:separate; border-spacing:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; }
thead th {
  position:sticky; top:0; z-index:3; background:#0e131c; color:var(--muted);
  font-size:15px; letter-spacing:.07em; text-transform:uppercase; font-weight:600;
  padding:10px 14px; border-bottom:1px solid var(--line2); white-space:nowrap;
}
/* Desktop shell: sticky thead — titlebar не перекрывает */
th,td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:last-child td { border-bottom:0; }
tbody tr.row { cursor:pointer; transition:background .12s; }
tbody tr.row:hover { background:var(--hover); }
th.sortable { cursor:pointer; user-select:none; }
th.sortable:hover { color:var(--fg); }
th.sortable .arrow { color:var(--cyan); font-size:11.5px; margin-left:3px; }
/* ★OUR — тонкая золотая кромка, не заливка */
tr.our td { background:rgba(255,205,86,.045); }
tr.our { box-shadow:inset 2px 0 0 var(--gold); }
tr.our .proj { color:var(--gold); }
.badge-our {
  display:inline-block; background:transparent; border:1px solid var(--gold); color:var(--gold);
  font-size:13.5px; font-weight:700; letter-spacing:.08em; padding:0 6px; border-radius:4px;
  margin-left:6px; vertical-align:1px;
}
/* источник: LLM яркий, heuristic тусклый пунктир */
.src-chip {
  display:inline-block; font-size:13.5px; font-weight:700; letter-spacing:.05em;
  padding:1px 7px; border-radius:4px; margin-left:6px; vertical-align:1px;
}
.src-chip.llm { color:var(--cyan); border:1px solid rgba(0,200,255,.45); background:var(--cyan-dim); }
.src-chip.heuristic { color:var(--muted); border:1px dashed var(--line2); opacity:.75; }
td.place { color:var(--muted); width:44px; font-family:var(--mono); font-size:18px; text-align:right; }
td.proj { min-width:190px; font-size:18px; font-weight:600; }
td.tracks { color:var(--cyan); font-size:17px; }
/* demo mini-icon */
.demoico { display:inline-flex; align-items:center; gap:6px; font-size:16px; color:var(--muted); white-space:nowrap; }
.demoico .sym { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; }
.demoico.ok .sym { background:rgba(143,181,115,.16); color:var(--green); }
.demoico.x .sym { background:transparent; border-radius:2px; color:var(--red); box-shadow:inset 0 0 0 1px rgba(217,96,90,.35); }
.demoico.warn .sym { background:rgba(232,201,106,.14); color:var(--amber); }
/* score bar */
.bar { display:inline-block; position:relative; width:70px; height:5px; border-radius:3px; background:var(--raised); overflow:hidden; vertical-align:middle; }
.bar .fill { position:absolute; left:0; top:0; bottom:0; border-radius:3px; }
.bar .fill.cyan { background:linear-gradient(90deg, var(--amber), var(--cyan)); }
.bar .fill.mid { background:linear-gradient(90deg, var(--red), var(--amber)); }
.cellbar { display:flex; align-items:center; gap:8px; }
.cellbar .v { font-family:var(--mono); font-size:17.5px; font-weight:700; min-width:28px; text-align:right; }
/* strength chip: число с цветовым акцентом */
.strength {
  display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:17px; font-weight:700;
  padding:2px 8px; border-radius:5px; background:var(--raised); border:1px solid var(--line);
}
.strength .scale { color:var(--dim); font-weight:400; font-size:14.5px; }
.strength.high { color:var(--cyan); border-color:rgba(0,200,255,.4); }
.strength.med { color:var(--amber); border-color:rgba(232,201,106,.35); }
.strength.low { color:var(--muted); }
td.tx { width:110px; }
.txchip {
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-size:15.5px; color:var(--cyan);
  background:var(--cyan-dim); border:1px solid rgba(0,200,255,.3); border-radius:5px;
  padding:2px 8px; text-decoration:none; transition:box-shadow .15s;
}
.txchip:hover { box-shadow:0 0 10px rgba(0,200,255,.25); }
.txchip .ext { font-size:11.5px; opacity:.7; }
.tx-empty { color:var(--dim); font-size:17px; }
td.verdict { color:var(--muted); font-size:17.5px; max-width:300px; }
/* аккордеон */
tr.acc-row td { cursor:default; background:var(--raised); border-bottom:1px solid var(--line2); }
.acc-body { padding:2px 14px 12px; }
.acc-inner { max-height:0; opacity:0; overflow:hidden; transition:max-height .3s ease, opacity .25s ease; }
.acc-inner.open { max-height:1400px; opacity:1; }
.acc-meta { display:flex; flex-wrap:wrap; gap:10px 18px; margin:4px 0 12px; font-size:15.5px; }
.acc-meta .k { color:var(--muted); margin-right:4px; }
.acc-meta .v { color:var(--fg); font-weight:600; }
.acc-tabs { display:flex; gap:4px; margin-bottom:10px; }
.acc-tabs button {
  background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:6px;
  padding:3px 12px; font:inherit; font-size:15px; cursor:pointer; transition:color .15s, border-color .15s;
}
.acc-tabs button:hover { color:var(--fg); }
.acc-tabs button.on { color:var(--cyan); border-color:var(--cyan); }
.scores-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px 22px; margin:0 0 12px; }
.scoreitem { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.scoreitem .lbl { color:var(--muted); font-size:15px; }
.scoreitem .lbl .src { opacity:.65; }
.scoreitem .bar { width:84px; }
.scoreitem .v { font-family:var(--mono); font-size:15.5px; font-weight:700; min-width:24px; text-align:right; }
.chip-val { font-size:14.5px; padding:1px 8px; border-radius:20px; font-weight:600; }
.chip-val.ok { background:rgba(143,181,115,.14); color:var(--green); }
.chip-val.mid { background:rgba(232,201,106,.14); color:var(--amber); }
.chip-val.bad { background:var(--red-dim); color:var(--red); }
.acc-note { max-width:78ch; font-size:17px; line-height:1.6; }
.acc-note .h { color:var(--muted); font-size:13.5px; letter-spacing:.07em; text-transform:uppercase; margin:12px 0 3px; }
.acc-note .h:first-child { margin-top:0; }
.details-sec { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
.foot { margin-top:16px; padding-top:10px; border-top:1px solid var(--line); color:var(--dim); font-size:14.5px; max-width:110ch; }
body.hw-desktop { padding-top:66px; }
body.hw-desktop .langsw { top:calc(66px + 24px); }
body.hw-desktop .pager { top:calc(66px + 24px); }
body.hw-desktop thead th { top:38px; }
</style></head><body data-catalog-date="04.11">
<h1>⚔ <span class="holo">Hackathon Watch</span></h1>
<div class="brand">by <span class="cyan">NEXUS AiOS</span></div>
<div class="pager" id="pager">
  <button type="button" data-page="rank" class="on" data-i18n="page.rank">Рейтинг</button>
  <button type="button" data-page="tracks" data-i18n="page.tracks">По трекам</button>
  <button type="button" data-page="feed" data-i18n="page.feed" id="tab-feed" style="display:none">Лента</button>
</div>
<div class="langsw">
  <button id="lang-en" class="on" type="button">EN</button>
  <button id="lang-ru" type="button">RU</button>
</div>
<div class="sub" id="sub">loading…</div>
<div id="deadline" class="deadline" style="display:none"></div>
<div class="cards">
  <div class="card"><div class="n" id="c-total">–</div><div class="l" data-i18n="stat.projects">Projects</div></div>
  <div class="card"><div class="n cyan" id="c-live">–</div><div class="l" data-i18n="stat.live">Live demos</div></div>
  <div class="card"><div class="n" id="c-xpost">–</div><div class="l" data-i18n="stat.xpost">X-post</div></div>
  <div class="card"><div class="n" id="c-high">–</div><div class="l" data-i18n="stat.high">Strong</div></div>
  <div class="card"><div class="n cyan" id="c-onchain">–</div><div class="l" data-i18n="stat.onchain">On-chain</div></div>
</div>
<div class="page on" id="page-rank">
<div class="toolbar">
  <div class="seg" id="seg-src">
    <button type="button" data-src="all" class="on">All <span class="cnt" id="cnt-all">0</span></button>
    <button type="button" data-src="llm">LLM <span class="cnt" id="cnt-llm">0</span></button>
    <button type="button" data-src="heuristic">heur <span class="cnt" id="cnt-heur">0</span></button>
  </div>
  <div class="search">
    <span class="ico">⌕</span>
    <input id="f-search" type="text" autocomplete="off" data-i18n-ph="search.ph" placeholder="search…">
  </div>
  <span id="hint"></span>
</div>
<table>
<thead><tr>
  <th class="sortable" data-k="rank" data-i18n="col.rank">Place</th>
  <th data-i18n="col.project">Project</th>
  <th class="sortable" data-k="tracks" data-i18n="col.tracks">Tracks</th>
  <th data-i18n="col.demo">Demo</th>
  <th class="sortable" data-k="win_prob" data-i18n="col.winprob">WinProb</th>
  <th class="sortable" data-k="strength" data-i18n="col.strength">Strength</th>
  <th data-i18n="col.tx">TxHash</th>
  <th data-i18n="col.note">Analyst note</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>

          (r.is_ours ? ' <span class="badge-our">OUR</span>' : '') +
          dupHtml(r) +
          '<span class="src-chip ' + src + '">' + t(src === 'heuristic' ? 'src.heuristic' : 'src.llm') + '</span>' +
          (src === 'llm' && ev && ev !== 'heuristic' ? '<span class="ev-chip">' + escapeHtml(ev.replace('nexus/', '')) + '</span>' : '') +
        '</td>' +
        '<td class="tracks">' + tracksHtml + '</td>' +
        '<td>' + demoIcon(r.demo) + '</td>' +
        '<td><span class="cellbar">' + barHtml(wp, 10) +
          '<span class="v" style="color:' + scaleColor((wp == null ? 0 : wp) / 10) + '">' + (wp == null ? '–' : wp) + '</span></span></td>' +
        '<td>' + strengthChip(strengthOf(r)) + '</td>' +
        '<td class="tx">' + txHtml(r) + crowdChip(r) + attestChip(r) + '</td>' +
        '<td class="verdict">' + escapeHtml((textOf(r.analysis || {}, lang).verdict || '').slice(0, 160)) + '</td>';
      tbody.appendChild(tr);
      if (state.open === r.id) {
        var srcTr = tr;
        var atr = document.createElement('tr');
        atr.className = 'acc-row';
        var atd = document.createElement('td');
        atd.colSpan = 8;
        var abody = document.createElement('div');
        abody.className = 'acc-body';
        var ainner = document.createElement('div');
        ainner.className = 'acc-inner open';
        ainner.id = 'acc-' + escapeHtml(r.id);
        ainner.appendChild(accordionContent(r));
        abody.appendChild(ainner);
        atd.appendChild(abody);
        atr.appendChild(atd);
        srcTr.parentNode.insertBefore(atr, srcTr.nextSibling);
      }
    });
    document.getElementById('hint').textContent = t('hint', [rows.length, data.ranking.length]);
    updateSortArrows();
    renderTracks();
    /* WAVE-2C: вкладка «Лента» видна только когда есть feed-события */
    var feedTab = document.getElementById('tab-feed');
    if (feedTab) feedTab.style.display = hasFeed() ? '' : 'none';
  };
  var renderFeed = function () {
    var list = document.getElementById('feed-list');
    var feed = data && Array.isArray(data.feed) ? data.feed.slice() : [];
    if (!feed.length) {
      list.innerHTML = '<div class="feed-empty">' + t('feed.empty') + '</div>';
      return;
    }
    /* ts может быть epoch-ms (number) или ISO-строкой — общий парсер, новый сверху */
    var tsKey = function (ev) {
      var v = (ev.ts_ms != null && ev.ts_ms !== '') ? ev.ts_ms : ev.ts;
      if (v == null || v === '') return 0;
      var n = Number(v);
      if (!isNaN(n)) return n;
      var t = new Date(v).getTime();
      return isNaN(t) ? 0 : t;
    };
    feed.sort(function (a, b) { return tsKey(b) - tsKey(a); });
    var top = feed.slice(0, 50);
    var ico = { new: 'new', removed: 'removed', demo_changed: 'demo' };
    list.innerHTML = '<div class="feed">' + top.map(function (ev) {
      var kind = ev.kind || 'demo_changed';
      var cls = ico[kind] || 'demo';
      var lbl = t('feed.kind.' + (ev.kind || 'demo_changed'));
      var name = escapeHtml(ev.name || ev.project_id || '');
      var det = ev.details ? escapeHtml(String(ev.details)).slice(0, 60) : '';
      var tsN = tsKey(ev);
      var ts = tsN ? fmtDate(new Date(tsN).toISOString()) : (ev.ts ? String(ev.ts) : '');
      return '<div class="feed-item">' +
        '<span class="ficon ' + cls + '">' + (kind === 'removed' ? '−' : kind === 'new' ? '+' : '◈') + '</span>' +
        '<span class="fname">' + name + '</span>' +
        '<span class="fdet">' + lbl + (det ? ' · ' + det : '') + '</span>' +
        '<span class="fts">' + escapeHtml(ts) + '</span>' +
      '</div>';
    }).join('') + '</div>';
  };
  var renderTracks = function () {
    var grid = document.getElementById('tracks-grid');
    var summary = document.getElementById('tracks-summary');
    if (!data) { grid.innerHTML = ''; summary.innerHTML = ''; return; }
    /* уникальные треки: считаем количество проектов, сортируем по убыванию */
    var trackMap = {};
    data.ranking.forEach(function (r) {
      (r.tracks || []).forEach(function (tk) { (trackMap[tk] = trackMap[tk] || []).push(r); });
    });
    var tracks = Object.keys(trackMap).sort(function (a, b) {
      var ca = trackMap[a], cb = trackMap[b];
      return ca[0].score ? (cb[0].score.win_prob - ca[0].score.win_prob) : 0;
    });
    /* отсортируем треки по числу участников, чтобы популярные были первыми */
    tracks.sort(function (a, b) { return trackMap[b].length - trackMap[a].length; });
    /* треки по числу участников; unique leaders по id */
    var podiumIds = {};
    var podiumLeaders = 0;
    var html = '';
    /* глобальный ранг: r.rank (idx+1 из ranking по win_prob) — мелким в overall */
    var overallMap = {};
    data.ranking.forEach(function (r) { overallMap[r.id] = r.rank; });
    tracks.forEach(function (tk) {
      var members = trackMap[tk].slice().sort(function (a, b) {
        return (b.score ? b.score.win_prob : 0) - (a.score ? a.score.win_prob : 0);
      });
      var top5 = members.slice(0, 5);
      var rowsHtml = top5.map(function (r, i) {
        var place = i + 1;
        var podCls = place === 1 ? 'podium-gold' : place === 2 ? 'podium-silver' : place === 3 ? 'podium-bronze' : '';
        if (place <= 3) { if (!podiumIds[r.id]) { podiumIds[r.id] = 1; podiumLeaders++; } }
        var wp = r.score ? r.score.win_prob : null;
        var overall = overallMap[r.id] || r.rank || '';
        return '<tr class="' + podCls + '">' +
          '<td class="tplace">' + place + '</td>' +
          '<td class="tproj" title="' + escapeHtml(r.project_name) + '">' + escapeHtml(r.project_name) +
            (r.is_ours ? ' <span class="badge-our">OUR</span>' : '') + dupHtml(r) +
            '<span class="toverall" title="overall rank">' + escapeHtml(overall) + '</span>' +
          '</td>' +
          '<td class="twp"><span class="cellbar">' + barHtml(wp, 10) +
            '<span class="v" style="color:' + scaleColor((wp == null ? 0 : wp) / 10) + '">' + (wp == null ? '–' : wp) + '</span></span></td>' +
          '<td class="tst">' + strengthChip(strengthOf(r)) + '</td>' +
          '<td class="tdemo">' + demoIconCompact(r.demo) + crowdChipCompact(r) + '</td>' +
        '</tr>';
      }).join('');
      html +=
        '<div class="p-track">' +
          '<div class="p-track-head">' +
            '<span class="tname">' + escapeHtml(tk) + '</span>' +
            '<span class="cnt">' + t('tracks.projects', [members.length]) + '</span>' +
          '</div>' +
          '<table class="p-table"><thead><tr>' +
            '<th class="tplace">' + t('tracks.col.place') + '</th>' +
            '<th class="tproj">' + t('tracks.col.project') + '</th>' +
            '<th class="twp">' + t('tracks.col.winprob') + '</th>' +
            '<th class="tst">' + t('tracks.col.strength') + '</th>' +
            '<th class="tdemo">' + t('tracks.col.demo') + '</th>' +
          '</tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
        '</div>';
    });
    grid.innerHTML = html;
    summary.innerHTML = t('tracks.summary', [tracks.length, podiumLeaders]);
  };
  var updateSortArrows = function () {
    document.querySelectorAll('th.sortable').forEach(function (th) {
      var k = th.getAttribute('data-k');
      var arrow = th.querySelector('.arrow');
      if (k === state.key) {
        if (!arrow) { arrow = document.createElement('span'); arrow.className = 'arrow'; th.appendChild(arrow); }
        arrow.textContent = state.dir === 1 ? '▲' : '▼';
      } else if (arrow) {
        arrow.parentNode.removeChild(arrow);
      }
    });
  };
  var updateFilters = function () {
    counts.all = 0; counts.llm = 0; counts.heuristic = 0; counts.tx = 0;
    data.ranking.forEach(function (r) {
      counts.all++;
      var src = sourceOf(r, lang);
      if (src === 'llm') counts.llm++; else counts.heuristic++;
      if ((r.tx && r.tx.hash) || r.tx_hash || r.onchain_tx) counts.tx++;
    });
    document.getElementById('cnt-all').textContent = counts.all;
    document.getElementById('cnt-llm').textContent = counts.llm;
    document.getElementById('cnt-heur').textContent = counts.heuristic;
    document.querySelectorAll('#seg-src button').forEach(function (b) {
      b.className = b.getAttribute('data-src') === state.src ? 'on' : '';
    });
    var evSet = {};
    data.ranking.forEach(function (r) { var e = evaluatorOf(r, lang); if (e && e !== 'heuristic') evSet[e] = 1; });
    var evNames = Object.keys(evSet).map(function (e) { return e.replace('nexus/', ''); });
    var chain = '';
    if (counts.tx > 0) {
      chain = ' · <span style="color:var(--cyan)">' + t('footchain', [evNames.join(', ') || 'LLM', 'hackwatch.yksunder.testnet', counts.tx]) + '</span>';
    }
    document.getElementById('foot').innerHTML = t('foot', [data.source.catalog]) + chain;
  };

  var escapeHtml = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var load = function () {
    try {
      var embedded = document.getElementById('hackwatch-data');
      if (!embedded) throw new Error('inline catalog data is missing');
      data = JSON.parse(embedded.textContent);
      fillData();
    } catch (err) {
      document.getElementById('sub').textContent = t('err', [err.message]);
    }
  };
  document.querySelectorAll('th.sortable').forEach(function (th) {
    th.addEventListener('click', function () {
      var k = th.getAttribute('data-k');
      if (state.key === k) state.dir = -state.dir; else { state.key = k; state.dir = 1; }
      render();
    });
  });
  document.getElementById('seg-src').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-src]');
    if (!b) return;
    state.src = b.getAttribute('data-src');
    updateFilters();
    render();
  });
  document.getElementById('rows').addEventListener('click', function (e) {
    var chip = e.target.closest('.track-chip');
    if (chip) {
      e.stopPropagation();
      var tk = chip.getAttribute('data-track');
      state.track = state.track === tk ? null : tk;
      render();
      return;
    }
    var tr = e.target.closest('tr.row');
    if (!tr) return;
    var id = tr.getAttribute('data-id');
    openAccordion(state.open === id ? null : id);
  });
  document.getElementById('f-search').addEventListener('input', function (e) {
    state.q = e.target.value;
    render();
  });
  document.getElementById('lang-en').addEventListener('click', function () { lang = 'en'; localStorage.setItem('hw-lang', 'en'); applyI18n(); });
  document.getElementById('lang-ru').addEventListener('click', function () { lang = 'ru'; localStorage.setItem('hw-lang', 'ru'); applyI18n(); });
  document.getElementById('pager').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-page]');
    if (!b) return;
    state.page = b.getAttribute('data-page');
    document.querySelectorAll('#pager button').forEach(function (x) { x.className = x === b ? 'on' : ''; });
    document.getElementById('page-rank').className = 'page' + (state.page === 'rank' ? ' on' : '');
    document.getElementById('page-tracks').className = 'page' + (state.page === 'tracks' ? ' on' : '');
    document.getElementById('page-feed').style.display = state.page === 'feed' ? 'block' : 'none';
    if (state.page === 'feed') renderFeed();
  });
  document.getElementById('sub').textContent = t('loading');
  applyI18n();
  load();
})();
</script>
</body></html>
